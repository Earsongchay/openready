name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f assets/styles.css
          test -f assets/app.js
          test -f user/dashboard.html
          test -f admin/dashboard.html

      - name: Check HTML references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path('.')
          html_files = list(root.rglob('*.html'))
          missing = []

          for html in html_files:
              text = html.read_text(encoding='utf-8')
              for attr, value in re.findall(r'(href|src)=["\']([^"\']+)["\']', text):
                  if value.startswith(('http://', 'https://', '#', 'mailto:', 'tel:', 'javascript:')):
                      continue
                  value = value.split('#', 1)[0].split('?', 1)[0]
                  if not value:
                      continue
                  target = (html.parent / value).resolve()
                  try:
                      target.relative_to(root.resolve())
                  except ValueError:
                      continue
                  if not target.exists():
                      missing.append(f'{html}: {attr}="{value}"')

          if missing:
              print('Broken local references found:')
              print('\n'.join(missing))
              sys.exit(1)

          print(f'Validated {len(html_files)} HTML files with no broken local references.')
          PY

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
